/* Willmeng Brand 2026 design system (Brand Standards v2026.02.19), copied from
   willmeng-standards/branding: tokens/colors, typography, spacing, elevation, and components/ui.css. */
/* ============================================================
   Willmeng — Color Tokens
   ------------------------------------------------------------
   Source of truth: WILLMENG BRAND STANDARDS GUIDE, v2026.02.19,
   "04. Brand Colors". The nine named brand colors below are
   EXACT (hex + Pantone from the guide). Numbered scale steps
   and tints marked "(derived)" are functional shades generated
   from the brand colors for UI states (hover, surfaces,
   borders) — they are not separate brand colors.
   ============================================================ */

:root {
  /* ============================================================
     OFFICIAL BRAND COLORS  (exact — do not alter)
     ============================================================ */

  /* -- Primary -- */
  --willmeng-blue: #004B80;  /* PANTONE 301C · logo, page headings */
  --navy:          #0B3454;  /* PANTONE 540C · background color */
  --cool-gray:     #AEB3B8;  /* PANTONE 5C   · subtle accents; text on navy */
  --dark-gray:     #343C3F;  /* PANTONE 432C · body text for large copy */

  /* -- Secondary -- */
  --sky-blue:      #12A8E1;  /* PANTONE 299C  · accent; works on navy */
  --bright-blue:   #007ABC;  /* PANTONE 7461C · accent; call-out text */
  --red-orange:    #E65625;  /* PANTONE 7579C · accent; linear elements */
  --gold:          #FBB826;  /* PANTONE 1235C · additional accent */
  --burnt-orange:  #973C21;  /* PANTONE 174C  · additional accent */

  --white: #FFFFFF;

  /* ============================================================
     Functional blue scale  (anchored on brand blues)
     ============================================================ */
  --blue-50:  #E8F1F8;  /* (derived) */
  --blue-100: #CFE4F1;  /* (derived) */
  --blue-200: #A6CCE5;  /* (derived) */
  --blue-300: #5FB6E8;  /* (derived) */
  --blue-400: var(--sky-blue);     /* #12A8E1 */
  --blue-500: var(--bright-blue);  /* #007ABC — links / interactive */
  --blue-600: #005E96;  /* (derived) */
  --blue-700: var(--willmeng-blue);/* #004B80 ★ primary */
  --blue-800: #003A61;  /* (derived) */
  --blue-900: var(--navy);         /* #0B3454 — dark surfaces */

  /* ============================================================
     Functional gray scale  ("Concrete" — anchored on Cool Gray
     #AEB3B8 and Dark Gray #343C3F)
     ============================================================ */
  --concrete-50:  #F5F6F7;  /* (derived) */
  --concrete-100: #EAECED;  /* (derived) */
  --concrete-200: #D9DCDE;  /* (derived) */
  --concrete-300: #C3C7CA;  /* (derived) */
  --concrete-400: var(--cool-gray);/* #AEB3B8 */
  --concrete-500: #8A9095;  /* (derived) */
  --concrete-600: #646B70;  /* (derived) */
  --concrete-700: #4A5256;  /* (derived) */
  --concrete-800: var(--dark-gray);/* #343C3F */
  --concrete-900: #262D30;  /* (derived) */
  --concrete-950: #191E20;  /* (derived) */

  /* ============================================================
     Accent ramp  (Red-Orange → Burnt Orange, both official)
     ============================================================ */
  --safety-100: #FBE3DA;  /* (derived tint) */
  --safety-300: #F2906B;  /* (derived) */
  --safety-400: #EC6E42;  /* (derived) */
  --safety-500: var(--red-orange);   /* #E65625 ★ accent */
  --safety-600: #C4481C;  /* (derived) */
  --safety-700: var(--burnt-orange); /* #973C21 */

  /* Gold accent */
  --gold-100: #FEEFC9;  /* (derived tint) */
  --gold-500: var(--gold);  /* #FBB826 */
  --gold-700: #8A6310;  /* (derived) */

  /* ============================================================
     Semantic status
     info=Bright Blue · warning=Gold · danger=Red-Orange (all
     brand). success uses a derived green — the brand has no
     success color, so this is the one functional exception.
     ============================================================ */
  --success-bg:   #E4F0EA;
  --success-500:  #2E7D52;  /* (derived — no brand green) */
  --success-700:  #1F5B3B;
  --warning-bg:   var(--gold-100);
  --warning-500:  var(--gold);
  --warning-700:  var(--gold-700);
  --danger-bg:    var(--safety-100);
  --danger-500:   var(--red-orange);
  --danger-700:   var(--burnt-orange);
  --info-bg:      var(--blue-100);
  --info-500:     var(--bright-blue);

  /* ============================================================
     SEMANTIC ALIASES — prefer these in product code
     ============================================================ */

  /* Brand */
  --brand:            var(--willmeng-blue);
  --brand-strong:     var(--navy);
  --brand-soft:       var(--blue-100);
  --accent:           var(--red-orange);
  --accent-strong:    var(--burnt-orange);
  --accent-soft:      var(--safety-100);
  --accent-gold:      var(--gold);

  /* Text */
  --text-strong:      var(--concrete-900);
  --text-body:        var(--dark-gray);      /* brand: text for large copy */
  --text-muted:       var(--concrete-600);
  --text-subtle:      var(--concrete-500);
  --text-on-brand:    var(--white);
  --text-on-dark:     var(--concrete-100);
  --text-link:        var(--bright-blue);    /* brand: call-out text */

  /* Surfaces */
  --surface-page:     var(--concrete-50);
  --surface-card:     var(--white);
  --surface-sunken:   var(--concrete-100);
  --surface-inverse:  var(--navy);           /* brand: background color */
  --surface-inverse-2:var(--concrete-950);
  --surface-brand:    var(--willmeng-blue);

  /* Borders / lines */
  --border-subtle:    var(--concrete-200);
  --border-default:   var(--concrete-300);
  --border-strong:    var(--cool-gray);
  --border-brand:     var(--willmeng-blue);
  --border-inverse:   rgba(255,255,255,0.16);

  /* Focus */
  --focus-ring:       rgba(0,122,188,0.45);  /* Bright Blue */

  /* Blueprint grid (decorative motif) */
  --blueprint-line:   rgba(0,75,128,0.08);
}

/* ============================================================
   Willmeng — Typography Tokens
   Display: Archivo · Body/UI: IBM Plex Sans · Data: IBM Plex Mono
   ============================================================ */

:root {
  /* ---- Families ---- */
  --font-display: 'Archivo', system-ui, sans-serif;
  --font-body:    'IBM Plex Sans', system-ui, sans-serif;
  --font-mono:    'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;

  /* ---- Weights ---- */
  --fw-regular:  400;  /* @kind font */
  --fw-medium:   500;  /* @kind font */
  --fw-semibold: 600;  /* @kind font */
  --fw-bold:     700;  /* @kind font */
  --fw-extra:    800;  /* @kind font */

  /* ---- Type scale (px) ---- */
  --fs-display-2xl: 64px;
  --fs-display-xl:  52px;
  --fs-display-lg:  42px;
  --fs-h1:          34px;
  --fs-h2:          28px;
  --fs-h3:          22px;
  --fs-h4:          18px;
  --fs-body-lg:     18px;
  --fs-body:        16px;
  --fs-body-sm:     14px;
  --fs-caption:     13px;
  --fs-overline:    12px;

  /* ---- Line heights ---- */
  --lh-tight:    1.05;  /* @kind font */
  --lh-snug:     1.2;   /* @kind font */
  --lh-normal:   1.5;   /* @kind font */
  --lh-relaxed:  1.65;  /* @kind font */

  /* ---- Tracking ---- */
  --ls-tight:    -0.02em;  /* @kind font */
  --ls-normal:   0;        /* @kind font */
  --ls-wide:     0.04em;   /* @kind font */
  --ls-overline: 0.12em;   /* @kind font */
}

/* ============================================================
   Type helper classes — apply directly or copy the rules
   ============================================================ */

.wm-display-2xl {
  font-family: var(--font-display);
  font-weight: var(--fw-extra);
  font-size: var(--fs-display-2xl);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--text-strong);
}
.wm-display-xl {
  font-family: var(--font-display);
  font-weight: var(--fw-extra);
  font-size: var(--fs-display-xl);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--text-strong);
}
.wm-display-lg {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  font-size: var(--fs-display-lg);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-tight);
  color: var(--text-strong);
}
.wm-h1 {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  font-size: var(--fs-h1);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-tight);
  color: var(--text-strong);
}
.wm-h2 {
  font-family: var(--font-display);
  font-weight: var(--fw-bold);
  font-size: var(--fs-h2);
  line-height: var(--lh-snug);
  color: var(--text-strong);
}
.wm-h3 {
  font-family: var(--font-display);
  font-weight: var(--fw-semibold);
  font-size: var(--fs-h3);
  line-height: var(--lh-snug);
  color: var(--text-strong);
}
.wm-h4 {
  font-family: var(--font-body);
  font-weight: var(--fw-semibold);
  font-size: var(--fs-h4);
  line-height: var(--lh-normal);
  color: var(--text-strong);
}
.wm-body-lg {
  font-family: var(--font-body);
  font-weight: var(--fw-regular);
  font-size: var(--fs-body-lg);
  line-height: var(--lh-relaxed);
  color: var(--text-body);
}
.wm-body {
  font-family: var(--font-body);
  font-weight: var(--fw-regular);
  font-size: var(--fs-body);
  line-height: var(--lh-relaxed);
  color: var(--text-body);
}
.wm-body-sm {
  font-family: var(--font-body);
  font-weight: var(--fw-regular);
  font-size: var(--fs-body-sm);
  line-height: var(--lh-normal);
  color: var(--text-body);
}
.wm-caption {
  font-family: var(--font-body);
  font-weight: var(--fw-regular);
  font-size: var(--fs-caption);
  line-height: var(--lh-normal);
  color: var(--text-muted);
}
/* Overline / eyebrow — the spec-sheet label motif */
.wm-overline {
  font-family: var(--font-mono);
  font-weight: var(--fw-medium);
  font-size: var(--fs-overline);
  line-height: 1;
  letter-spacing: var(--ls-overline);
  text-transform: uppercase;
  color: var(--text-muted);
}
/* Data / stat numerals */
.wm-data {
  font-family: var(--font-mono);
  font-weight: var(--fw-medium);
  font-variant-numeric: tabular-nums;
  letter-spacing: var(--ls-normal);
  color: var(--text-strong);
}

/* ============================================================
   Willmeng — Spacing & Layout Tokens  (4px base grid)
   ============================================================ */

:root {
  --space-0:   0;
  --space-1:   2px;
  --space-2:   4px;
  --space-3:   8px;
  --space-4:   12px;
  --space-5:   16px;
  --space-6:   20px;
  --space-7:   24px;
  --space-8:   32px;
  --space-9:   40px;
  --space-10:  48px;
  --space-11:  64px;
  --space-12:  80px;
  --space-13:  96px;
  --space-14:  128px;

  /* Layout */
  --container-max:    1200px;
  --container-wide:   1400px;
  --gutter:           24px;
  --section-y:        96px;   /* vertical rhythm between page sections */

  /* Control sizing (buttons, inputs) */
  --control-h-sm:     32px;
  --control-h-md:     42px;
  --control-h-lg:     52px;
}

/* ============================================================
   Willmeng — Elevation: radii, borders, shadows
   ------------------------------------------------------------
   The brand reads sturdy and grounded: modest corner radii
   (never pill-shaped cards), 1px structural borders, and soft,
   low shadows tinted with the navy brand color rather than
   pure black.
   ============================================================ */

:root {
  /* ---- Corner radii ---- */
  --radius-xs:   3px;
  --radius-sm:   5px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --radius-pill: 999px;   /* tags / chips only */

  /* ---- Border widths ---- */
  --bw-hair:   1px;
  --bw-thick:  2px;       /* emphasis / active states */

  /* ---- Shadows (navy-tinted) ---- */
  --shadow-xs: 0 1px 2px rgba(11,52,84,0.08);
  --shadow-sm: 0 1px 3px rgba(11,52,84,0.10), 0 1px 2px rgba(11,52,84,0.06);
  --shadow-md: 0 4px 12px rgba(11,52,84,0.10), 0 2px 4px rgba(11,52,84,0.06);
  --shadow-lg: 0 12px 28px rgba(11,52,84,0.14), 0 4px 8px rgba(11,52,84,0.08);
  --shadow-xl: 0 24px 56px rgba(11,52,84,0.18);

  /* ---- Focus ring ---- */
  --ring: 0 0 0 3px var(--focus-ring);

  /* ---- Motion ---- */
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);   /* @kind other */
  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */
  --dur-fast:      120ms;  /* @kind other */
  --dur-base:      180ms;  /* @kind other */
  --dur-slow:      280ms;  /* @kind other */
}

/* ============================================================
   Willmeng — Component styles
   Class-based so hover / focus / active states are real CSS.
   React wrappers under components/ apply these classes.

/* ---------------- Button ---------------- */

/* ---------------- IconButton ---------------- */

.wm-input, .wm-select, .wm-textarea {

/* ---------------- Checkbox / Switch ---------------- */
.wm-checkbox { display: inline-flex; align-items: center; gap: var(--space-3); cursor: pointer; font-family: var(--font-body); font-size: var(--fs-body-sm); color: var(--text-body); }

  border: var(--bw-thick) solid var(--border-strong); background: var(--surface-card);

.wm-card {

  .wm-btn.danger { color: var(--danger-700); }
  .wm-btn.danger:hover { background: var(--danger-bg); }
  .toast {

    padding: var(--space-4) var(--space-6);
    background: var(--surface-inverse); color: var(--text-on-dark);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    font-size: var(--fs-body-sm); font-weight: var(--fw-semibold);
    max-width: calc(100% - 32px);
  }
</style>

  /* ---------- list ---------- */
  function sortActive(a, b) {
    var ad = a.due_date || '9999-12-31', bd = b.due_date || '9999-12-31';
    if (ad !== bd) return ad < bd ? -1 : 1;
    var pa = (PRIORITY[a.priority] || PRIORITY.normal).rank, pb = (PRIORITY[b.priority] || PRIORITY.normal).rank;

    return (b.added_at || '') < (a.added_at || '') ? -1 : 1;
  }

    var active = items.filter(function (i) { return i.status !== 'resolved'; });
    var late = active.filter(isOverdue).length, week = active.filter(isDueWeek).length;

      if (categoryFilter && i.category !== categoryFilter) return false;

      return {
        title: title.value.trim(), details: details.value.trim(), category: category.value, area: area.value.trim(),
        priority: priority, due_date: due.value || null, tracker: tracker.value.trim(), waiting_on: waiting.value.trim(),
        ref: ref.value.trim(), impact_days: n === '' || isNaN(parseInt(n, 10)) ? null : Math.max(0, parseInt(n, 10))
      };
    }

    async function commit(newStatus) {
      var v = values();
      if (!v.title) { setErr('Describe the constraint first.'); return; }
      busy = true; sync(); setErr('');
      try {
        if (isNew) {
          v.id = uuid(); v.added_by = state.name.trim();
          await api('site_constraints', { method: 'POST', prefer: 'return=minimal', body: v });
          lastCategory = v.category; tab = 'open';
          toast('Added to the log');
        } else {
          if (newStatus && newStatus !== curStatus) {
            v.status = newStatus; v.status_by = state.name.trim(); v.status_at = new Date().toISOString();
            v.resolved_at = newStatus === 'resolved' ? new Date().toISOString() : null;
            tab = newStatus;
          }
          await api('site_constraints?id=eq.' + item.id, { method: 'PATCH', prefer: 'return=minimal', body: v });
          if (v.status) {
            api('site_constraint_updates', { method: 'POST', prefer: 'return=minimal', body: { constraint_id: item.id, note: 'Status changed to ' + STATUS[v.status].label, by: state.name.trim(), kind: 'status' } }).catch(function () {});
          }
          toast(v.status ? 'Marked ' + STATUS[v.status].label.toLowerCase() : 'Saved');
        }
        closeLayer();
        await refresh();
      } catch (e) {
        busy = false; sync(); setErr(errText(e));
      }
    }
    primary.addEventListener('click', function () { commit(null); });

    var kids = [
      el('h2', { text: isNew ? 'Add constraint' : 'Constraint details' }),
      datalist('dl_people', people), datalist('dl_parties', parties), datalist('dl_areas', areas),
      field('f_title', 'Constraint', title),
      field('f_details', 'Details', details),
      el('div', { class: 'field wm-field' }, el('span', { class: 'wm-label', text: 'Priority' }), prioSet),
      field('f_due', 'Due date',
        el('div', { class: 'row' }, due, el('button', { class: 'wm-btn wm-btn--secondary small', type: 'button', text: 'Clear', onclick: function () { due.value = ''; } }))),
      field('f_tracker', 'Who is tracking it', tracker),
      field('f_waiting', 'Waiting on', waiting),
      field('f_cat', 'Category', category),
      field('f_area', 'Area or schedule activity affected', area),
      el('div', { class: 'two' },
        field('f_ref', 'Reference', ref),
        field('f_impact', 'Schedule impact (days)', impact))
    ];

    if (!isNew) {
      var statusSet = el('div', { class: 'seg' });
      ORDER.forEach(function (s) {
        statusSet.append(el('button', { type: 'button', 'aria-pressed': String(s === curStatus), style: '--c:' + STATUS[s].color, text: STATUS[s].label,
          onclick: function () { if (s !== curStatus) commit(s); } }));
      });
      kids.push(el('div', { class: 'field wm-field' }, el('span', { class: 'wm-label', text: 'Status' }), statusSet));
      var hist = el('div', { class: 'history' }, el('span', { text: 'Logged by ' + who(item.added_by) + ' ' + when(item.added_at) }));
      if (item.status_at) hist.append(el('span', { text: 'Status last changed by ' + who(item.status_by) + ' ' + when(item.status_at) }));
      kids.push(hist);
    }

    kids.push(err);
    var actions = el('div', { class: 'actions' }, primary, el('button', { class: 'wm-btn wm-btn--ghost wm-btn--lg wm-btn--block', type: 'button', text: 'Cancel', onclick: closeLayer }));
    if (!isNew && mine) {
      var armed = false;
      var del = el('button', { class: 'wm-btn wm-btn--ghost wm-btn--lg wm-btn--block danger', type: 'button', text: 'Delete constraint' });
      del.addEventListener('click', async function () {
        if (!armed) { armed = true; del.textContent = 'Tap again to delete'; return; }
        del.disabled = true;
        try {
          await api('site_constraints?id=eq.' + item.id, { method: 'DELETE', prefer: 'return=minimal' });
          closeLayer(); toast('Constraint deleted'); refresh();
        } catch (e) { del.disabled = false; setErr(errText(e)); }
      });
      actions.append(del);
    }
    kids.push(actions);

    if (!isNew) {
      var feed = el('div', { class: 'feed' }, el('p', { class: 'meta', text: 'Loading updates…' }));
      var note = el('textarea', { id: 'f_note', class: 'wm-textarea', maxlength: '2000', rows: '2', placeholder: 'Add an update: what changed, who you spoke with, new date' });
      var post = el('button', { class: 'wm-btn wm-btn--secondary small', type: 'button', text: 'Post update' });
      var noteErr = el('p', { class: 'err', hidden: true, role: 'alert' });

      var loadFeed = async function () {
        try {
          var rows = await api('site_constraint_updates?select=*&constraint_id=eq.' + item.id + '&order=at.asc');
          feed.textContent = '';
          if (!rows || !rows.length) { feed.append(el('p', { class: 'meta', text: 'No updates yet.' })); return; }
          rows.forEach(function (u) {
            feed.append(el('div', { class: 'upd' + (u.kind === 'status' ? ' status' : '') },
              el('span', { class: 'meta', text: who(u.by) + ' ' + when(u.at) }),
              el('span', { class: 'txt', text: u.note })));
          });
        } catch (e) { feed.textContent = ''; feed.append(el('p', { class: 'meta', text: 'Couldn’t load updates.' })); }
      };
      post.addEventListener('click', async function () {
        var text = note.value.trim();
        if (!text) return;
        post.disabled = true; noteErr.hidden = true;
        try {
          var nowIso = new Date().toISOString();
          await api('site_constraint_updates', { method: 'POST', prefer: 'return=minimal', body: { constraint_id: item.id, note: text, by: state.name.trim(), kind: 'note' } });
          await api('site_constraints?id=eq.' + item.id, { method: 'PATCH', prefer: 'return=minimal', body: { last_note: text, last_note_by: state.name.trim(), last_note_at: nowIso } });
          note.value = '';
          await loadFeed();
          refresh();
        } catch (e) { noteErr.textContent = errText(e); noteErr.hidden = false; }
        post.disabled = false;
      });

      kids.push(el('h3', { text: 'Updates' }), feed,
        field('f_note', 'New update', note), noteErr,
        el('div', { class: 'row' }, post));
      loadFeed();
    }

    openLayer(el('div', { class: 'sheet', role: 'dialog', 'aria-label': isNew ? 'Add constraint' : 'Constraint details' }, kids));
    sync();
    if (isNew) title.focus();
  }

  /* ---------- start ---------- */
  function start() {
    started = true;
    $('top').hidden = false; $('mainWrap').hidden = false; $('addbar').hidden = false;
    toolbarSig = '';
    renderHeader();
    render();
    loadJob();
    refresh();
    startPolling();
  }

  $('addBtn').addEventListener('click', function () { openSheet(null); });
  $('jobBtn').addEventListener('click', openJobSheet);
  $('whoBtn').addEventListener('click', function () { showGate(''); });

  (async function init() {
    if (!configured()) {
      $('notice').append(el('div', { class: 'notice wm-alert wm-alert--info' },
        el('p', { class: 'wm-alert__body', text: 'This page isn’t connected to a database yet. Open index.html, paste your Supabase URL and key at the top of the script, and upload it again. UPDATE.md has the steps.' })));
      return;
    }
    state.name = recall('punch.name'); state.code = recall('punch.code');
    if (!state.name || !state.code) { showGate(''); return; }
    try {
      if (await codeIsValid()) { start(); return; }
      showGate('The team code was rejected. Enter it again.');
    } catch (e) {
      start();
    }
  })();
})();
</script>
</body>
</html>
